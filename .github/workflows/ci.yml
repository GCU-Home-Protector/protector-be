name: Dockerize & Push Server Image to ECR (CI Step)

on:
  workflow_dispatch:
#  pull_request:
#    types : [opened, synchronize]
#    branches: [ "master" ]

env:
  AWS_REGION: ap-northeast-2                   
  ECR_REPOSITORY: ${{ secrets.AWS_ECR_REPOSITORY_NAME }}          

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 'Set up jdk'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin' # https://github.com/actions/setup-java
      
      # gradle caching - 빌드 시간 향상
      - name: Gradle Caching
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # base64 형태 저장된 application.yml 가져와 저장
      - name : Set YML
        run : |
           mkdir -p src/main/resources
           echo "${{secrets.APPLICATION_YML}}" | base64 --decode > src/main/resources/application.yml

      # Build (feat. TestContainers)
      - name : Build with Gradle
        run : |
           chmod +x ./gradlew
           ./gradlew test --no-parallel --no-daemon --info --stacktrace

#      - name: Set Gradlew Executable Permissions
#        run: chmod +x ./gradlew
#
#      - name : Run tests
#        run : ./gradlew test --no-parallel --no-daemon --info --stacktrace

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          # echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
